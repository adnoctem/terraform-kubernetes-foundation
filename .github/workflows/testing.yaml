name: "Testing"

on:
  workflow_dispatch: {}
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: "${{ github.workflow }}@${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out modules, examples, and tests.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            version: 1.11.4
          - engine: terraform
            version: 1.16.6
          - engine: tofu
            version: 1.11.14
          - engine: tofu
            version: 1.13.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: matrix.engine == 'terraform'
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.engine == 'tofu'
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      - name: Validate modules, examples, and behavior
        env:
          TF_ENGINE: ${{ matrix.engine }}
          TF_IN_AUTOMATION: "1"
        run: |
          "$TF_ENGINE" fmt -check -recursive
          # Discover tracked configurations, including nested modules and test helpers.
          mapfile -t directories < <(
            {
              printf '.\n'
              git ls-files -z -- '*.tf' '*.tf.json' |
                while IFS= read -r -d '' source_file; do
                  dirname "$source_file"
                done
            } | sort -u
          )
          for directory in "${directories[@]}"; do
            "$TF_ENGINE" -chdir="$directory" init -backend=false -input=false -no-color
            "$TF_ENGINE" -chdir="$directory" validate -no-color
          done
          "$TF_ENGINE" test -no-color

      - name: Set up Helm for chart rendering
        if: matrix.engine == 'terraform' && matrix.version == '1.16.6'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Render both mesh modes from Terraform fixture values
        if: matrix.engine == 'terraform' && matrix.version == '1.16.6'
        env:
          TF_IN_AUTOMATION: "1"
        run: |
          # Mock fixtures contain no credentials. Keep verbose state in temporary files.
          render_dir=$(mktemp -d)
          trap 'rm -rf "$render_dir"' EXIT
          terraform test -filter=tests/render.tftest.hcl -json -verbose > "$render_dir/tests.jsonl"
          jq -r '
            select(.type == "test_state") | .["@testrun"] as $run |
            .test_state.root_module | .. | objects |
            select(.type? == "helm_release" and has("values")) |
            {run: $run, release: .values} | @base64
          ' "$render_dir/tests.jsonl" > "$render_dir/releases.txt"
          test "$(wc -l < "$render_dir/releases.txt")" -eq 19
          while IFS= read -r record; do
            printf '%s' "$record" | base64 --decode > "$render_dir/release.json"
            release_file="$render_dir/release.json"
            name=$(jq -r '.release.name' "$release_file")
            namespace=$(jq -r '.release.namespace' "$release_file")
            repository=$(jq -r '.release.repository' "$release_file")
            chart=$(jq -r '.release.chart' "$release_file")
            version=$(jq -r '.release.version' "$release_file")
            mode=$(jq -r '.run' "$release_file")
            args=(--namespace "$namespace" --version "$version" --kube-version 1.34.0 --include-crds)
            if [[ "$repository" == oci://* ]]; then
              chart="${repository%/}/$chart"
            else
              args+=(--repo "$repository")
            fi
            value_files=()
            value_count=$(jq '.release.values | length' "$release_file")
            for ((index=0; index<value_count; index++)); do
              values_file="$render_dir/values-$index.yaml"
              jq -r --argjson index "$index" '.release.values[$index]' "$release_file" > "$values_file"
              args+=(-f "$values_file")
              value_files+=("$values_file")
            done
            helm template "$name" "$chart" "${args[@]}" > "$render_dir/rendered.yaml"
            test -s "$render_dir/rendered.yaml"
            # Every account/metadata fixture marker must survive chart rendering.
            if ((${#value_files[@]})); then
              while IFS= read -r marker; do
                grep -Fq "$marker" "$render_dir/rendered.yaml" || {
                  printf 'Chart %s ignored fixture setting %s\n' "$chart" "$marker" >&2
                  exit 1
                }
              done < <(grep -hoE 'foundation-test-[a-z0-9-]+' "${value_files[@]}" | sort -u)
            fi
            printf 'Rendered %s: %s (%s)\n' "$mode" "$name" "$version"
          done < "$render_dir/releases.txt"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the Terraform configuration to lint.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint
        run: tflint --init --config="$GITHUB_WORKSPACE/.github/linters/.tflint.hcl"

      - name: Lint Terraform
        run: |
          mapfile -t directories < <(
            git ls-files -z -- '*.tf' '*.tf.json' |
              while IFS= read -r -d '' source_file; do
                dirname "$source_file"
              done | sort -u
          )
          for directory in "${directories[@]}"; do
            args=(--chdir="$directory" --format compact --config="$GITHUB_WORKSPACE/.github/linters/.tflint.hcl")
            # Test helpers follow HashiCorp's single-file main.tf examples.
            if [[ "$directory" == tests || "$directory" == tests/* ]]; then
              args+=(--disable-rule=terraform_standard_module_structure)
            fi
            tflint "${args[@]}"
          done

  dispatch:
    name: Dispatch a release
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    permissions:
      actions: write # Dispatch release.yaml after all tests and lint succeed.
    steps:
      - name: Dispatch the tested branch and commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'release.yaml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: { sha: context.sha }
            });
